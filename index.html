<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El meu Espai Personal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container py-4">
  <header class="pb-3 mb-4 border-bottom">
    <h1 class="fs-4">🎮 El meu Top de Videojocs</h1>
  </header>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col">
      <div class="card bg-secondary text-white h-100">
        <div class="card-body">
          <h5 class="card-title">The Witcher 3</h5>
          <p class="card-text">Un dels millors JRPG d'acció amb una gran història.</p>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card bg-secondary text-white h-100">
        <div class="card-body">
          <h5 class="card-title">Cyberpunk 2077</h5>
          <p class="card-text">Món obert futurista ple de detalls i tecnologia.</p>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card bg-secondary text-white h-100">
        <div class="card-body">
          <h5 class="card-title">Elden Ring</h5>
          <p class="card-text">Desafiament i exploració en un món fantàstic.</p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
